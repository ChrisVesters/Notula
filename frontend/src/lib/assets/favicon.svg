<svg
	xmlns="http://www.w3.org/2000/svg"
	width="512"
	height="512"
	viewBox="0 7 512 512"
>
	<title>Notula</title>

	<!-- the y offset of 7 centres the artwork: the speech tail extends
	     below the clipboard, so the ink spans y 61-464, not 0-512 -->

	<!-- speech tail -->
	<path
		d="M190 400l55 55a18 18 0 0 0 25 0l55-55"
		fill="#46a3b5"
		stroke="#173554"
		stroke-width="10"
		stroke-linejoin="round"
	/>

	<g
		fill="none"
		stroke="#173554"
		stroke-width="10"
		stroke-linecap="round"
		stroke-linejoin="round"
	>
		<!-- clipboard -->
		<rect x="120" y="110" width="272" height="290" rx="28" fill="#fff" />
		<rect x="180" y="90" width="152" height="42" rx="16" fill="#173554" />
		<path d="M232 90a24 24 0 0 1 48 0" />

		<!-- checklist -->
		<rect x="160" y="170" width="42" height="42" rx="4" />
		<path d="M170 190l12 12 26-28" />

		<rect x="160" y="240" width="42" height="42" rx="4" />
		<path d="M170 260l12 12 26-28" />

		<rect x="160" y="310" width="42" height="42" rx="4" />
		<path d="M170 330l12 12 26-28" />

		<!-- text lines -->
		<path d="M250 180h90M250 205h55M250 250h95M250 275h55M250 320h90M250 345h55" />
	</g>
</svg>
